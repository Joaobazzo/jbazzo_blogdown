<!-- Lightbox: click any image in a post to view it full screen -->
<style>
  main img { cursor: zoom-in; }
  #lb { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center;
        flex-direction: column; background: rgba(0,0,0,.88); }
  #lb.open { display: flex; }
  #lb img { max-width: 94vw; max-height: 86vh; object-fit: contain; cursor: zoom-out; box-shadow: 0 4px 24px rgba(0,0,0,.5); }
  #lb .cap { color: #eee; margin-top: 10px; font-size: .9em; text-align: center; max-width: 90vw; }
  #lb button { position: absolute; background: none; border: 0; color: #fff; font-size: 2.4em; cursor: pointer;
               padding: 10px 18px; opacity: .75; }
  #lb button:hover { opacity: 1; }
  #lb .close { top: 6px; right: 10px; }
  #lb .prev { left: 6px; top: 50%; transform: translateY(-50%); }
  #lb .next { right: 6px; top: 50%; transform: translateY(-50%); }
</style>
<div id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="close" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous image">&#8249;</button>
  <img alt="">
  <div class="cap"></div>
  <button class="next" aria-label="Next image">&#8250;</button>
</div>
<script>
(function () {
  var imgs = Array.prototype.filter.call(document.querySelectorAll('main img'),
               function (im) { return !im.closest('a'); });
  if (!imgs.length) return;
  var lb = document.getElementById('lb'), big = lb.querySelector('img'),
      cap = lb.querySelector('.cap'), i = 0;
  lb.querySelector('.prev').style.display = lb.querySelector('.next').style.display =
    imgs.length > 1 ? '' : 'none';
  function show(n) {
    i = (n + imgs.length) % imgs.length;
    big.src = imgs[i].currentSrc || imgs[i].src;
    big.alt = imgs[i].alt || '';
    cap.textContent = imgs[i].alt || '';
  }
  function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  imgs.forEach(function (im, n) {
    im.addEventListener('click', function () {
      show(n); lb.classList.add('open'); document.body.style.overflow = 'hidden';
    });
  });
  lb.addEventListener('click', function (e) {
    if (e.target.classList.contains('prev')) show(i - 1);
    else if (e.target.classList.contains('next')) show(i + 1);
    else close();
  });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(i - 1);
    else if (e.key === 'ArrowRight') show(i + 1);
  });
})();
</script>
